<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>جارك | Gaarak - اطلب مساعدة من أقرب جار</title>
<meta name="description" content="Gaarak: post a small task on the map, the nearest neighbor helps, and earns points. جارك: انزل مهمة على الخريطة وأقرب جار يساعدك.">
<link rel="icon" href="logo.svg">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand"><img src="logo.svg" alt=""><div><b>جارك</b><small>Gaarak</small></div></div>
  <div class="me"><span id="wallet">0</span> <span data-t="pts">نقطة</span><button id="lang" class="ghost">EN</button></div>
</header>
<main>
  <section id="mapwrap"><div id="map"></div>
    <button id="locate" class="fab" title="location">📍</button>
    <button id="add" class="fab primary" data-t="addBtn">+ اطلب مساعدة</button>
  </section>
  <aside>
    <div class="hero"><h1 data-t="hero">محتاج حاجة؟ جارك قريب منك.</h1><p data-t="sub">انزل مهمة صغيرة على الخريطة، أقرب جار يساعدك ويكسب نقاط تتحول لفلوس.</p></div>
    <nav class="tabs"><button class="on" data-tab="near" data-t="near">حواليك</button><button data-tab="mine" data-t="mine">مهامي</button><button data-tab="board" data-t="board">الأبطال</button></nav>
    <div class="chips" id="chips"></div>
    <div id="list"></div>
  </aside>
</main>
<dialog id="dlg"><form method="dialog" id="form">
  <h3 data-t="newTitle">طلب مساعدة جديد</h3>
  <p class="hint" id="pickhint" data-t="pick">اضغط على الخريطة لتحديد المكان</p>
  <label><span data-t="what">محتاج إيه؟</span><input name="title" required maxlength="80"></label>
  <label><span data-t="cat">النوع</span><select name="cat" id="catsel"></select></label>
  <label><span data-t="reward">المكافأة (نقاط)</span><input name="reward" type="number" min="5" max="500" value="30"></label>
  <label class="chk"><input type="checkbox" name="urgent"> <span data-t="urgent">مستعجل</span></label>
  <div class="row"><button value="cancel" class="ghost" data-t="cancel">إلغاء</button><button id="submit" value="ok" class="primary" data-t="post">انشر الطلب</button></div>
</form></dialog>
<div id="toast"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
